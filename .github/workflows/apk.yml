name: APK debug ARMv7
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Instalar NDK e CMake
        run: sdkmanager --install "ndk;27.2.12479018" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Compilar APK ARMv7 com llama.cpp
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Verificar ABI do APK
        run: |
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep 'lib/armeabi-v7a/libpuppy_llama.so'
          if unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -E 'lib/(arm64-v8a|x86_64)/'; then
            echo "ABI inesperada no APK"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: puppy-armv7-llama-debug
          path: app/build/outputs/apk/debug/*.apk
