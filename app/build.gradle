plugins {
    id 'com.android.application'
}

// Chave de assinatura fixa (só para testes): permite atualizar o app sem desinstalar.
def debugKey = layout.buildDirectory.file('debug-signing.keystore').get().asFile
debugKey.parentFile.mkdirs()
debugKey.bytes = java.util.Base64.decoder.decode(rootProject.file('debug-signing.keystore.b64').text.trim())

android {
    namespace 'br.karina.pet'
    compileSdk 34
    ndkVersion '27.2.12479018'

    signingConfigs {
        debug {
            storeFile debugKey
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    defaultConfig {
        applicationId 'br.karina.pet'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '0.1'
        ndk { abiFilters 'armeabi-v7a' }
        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17'
                arguments '-DANDROID_STL=c++_shared'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
