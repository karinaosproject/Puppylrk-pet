plugins {
    id 'com.android.application'
}

// Chave de assinatura fixa (só para testes): permite atualizar o app sem desinstalar.
def debugKey = layout.buildDirectory.file('debug-signing.keystore').get().asFile
debugKey.parentFile.mkdirs()
debugKey.bytes = java.util.Base64.decoder.decode(rootProject.file('debug-signing.keystore.b64').text.trim())

android {
    namespace 'br.karina.pet'
    compileSdk 34

    signingConfigs {
        debug {
            storeFile debugKey
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    defaultConfig {
        applicationId 'br.karina.pet'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '0.1'
        // Sem bibliotecas nativas: o mesmo APK roda em 32 bits (armeabi-v7a) e 64 bits.
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
